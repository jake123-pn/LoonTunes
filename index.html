<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LoopTunes 🎧</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#080810;
color:white;
padding-bottom:90px;

}



.page{

height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;

}




.card{

background:#171722;
padding:30px;
border-radius:25px;
width:100%;
max-width:420px;

}



h1,h2{

text-align:center;
margin-bottom:20px;

}




input{

width:100%;
padding:15px;
margin:10px 0;

border:none;
outline:none;

border-radius:25px;

background:#252535;

color:white;

}




button{

cursor:pointer;

}



.main{

width:100%;
padding:15px;

border:none;

border-radius:25px;

background:linear-gradient(135deg,#6a11cb,#2575fc);

color:white;

margin-top:10px;

font-size:16px;

}



.google{

background:white;
color:black;

}



a{

color:#4da3ff;
cursor:pointer;

}




header{

background:linear-gradient(135deg,#6a11cb,#2575fc);

padding:25px;

border-radius:0 0 30px 30px;

}



.container{

padding:20px;

}




.song{

display:flex;

align-items:center;

gap:15px;

background:#171722;

padding:15px;

margin:15px 0;

border-radius:20px;

}



.song img{

width:70px;

height:70px;

border-radius:15px;

object-fit:cover;

}



.song-info{

flex:1;

}



.play,
.like{

width:45px;

height:45px;

border:none;

border-radius:50%;

background:#6a11cb;

color:white;

font-size:18px;

}



.like{

background:#e91e63;

}





.player{

position:fixed;

bottom:70px;

left:10px;

right:10px;

background:#171722;

padding:15px;

border-radius:20px;

}



#progress{

width:100%;

}




nav{

position:fixed;

bottom:0;

left:0;

right:0;

height:65px;

background:#11111a;

display:flex;

justify-content:space-around;

align-items:center;

}



nav button{

background:none;

border:none;

color:white;

}



.section{

display:none;

}


/* Persistence controls */
.persistence-controls{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:center;
  margin-top:10px;
}
.persistence-controls button{
  padding:6px 10px;
  border-radius:12px;
  border:none;
  background:#ffffff22;
  color:white;
  font-size:13px;
}
.persistence-controls button.active{
  background:rgba(255,255,255,0.12);
  box-shadow:0 2px 6px rgba(0,0,0,0.4) inset;
}
#persistenceIndicator{
  font-size:13px;
  color:#e0e8ff;
}


</style>


</head>


<body>




<!-- LOGIN -->


<div class="page" id="loginPage">


<div class="card">


<h1>
🎧 LoopTunes
</h1>


<h2>
Login
</h2>



<input
id="loginEmail"
type="email"
placeholder="Email">



<input
id="loginPassword"
type="password"
placeholder="Password">



<button class="main" onclick="login()">

Login

</button>




<button class="main google" onclick="googleLogin()">

🌐 Continue with Google

</button>




<p style="margin-top:15px">

No account?

<a onclick="showRegister()">

Create Account

</a>

</p>


</div>


</div>





<!-- REGISTER -->


<div class="page" id="registerPage" style="display:none;">



<div class="card">


<h2>
Create Account
</h2>



<input
id="username"
placeholder="Username">



<input
id="registerEmail"
type="email"
placeholder="Email">


<input
id="registerPassword"
type="password"
placeholder="Password">


<button class="main" onclick="register()">

Create Account

</button>



<p>

Already have account?

<a onclick="showLogin()">

Login

</a>

</p>


</div>


</div>





<!-- MAIN APP -->


<div id="app" style="display:none;">


<header>

<h1>
🎧 LoopTunes
</h1>


<p>
Your music world
</p>

<!-- Persistence controls + indicator -->
<div class="persistence-controls">
  <button id="btnSession" onclick="window.useSessionPersistence()">Session only</button>
  <button id="btnLocal" onclick="window.useLocalPersistence()">Remember me</button>
  <span id="persistenceIndicator">Persistence: —</span>
</div>

</header>


<div class="container">


<!-- HOME -->


<div id="homeSection">


<input
id="searchBox"
class="search"
placeholder="Search songs..."
onkeyup="searchSongs()">



<h2>
Music Library
</h2>



<div id="songsList">

</div>


</div>





<!-- FAVORITES -->


<div id="favoritesSection" class="section">


<h2>
❤️ Favorites
</h2>


<div id="favoritesList">

</div>


</div>






<!-- PROFILE -->


<div id="profileSection" class="section">


<h2>
👤 Profile
</h2>


<p id="userName"></p>


<button class="main" onclick="logout()">

Logout

</button>


</div>




<!-- ADMIN UPLOAD PLACE -->


<div id="uploadSection" class="section">


<h2>
🎤 Upload Song
</h2>


<div id="uploadBox">


</div>


</div>



</div>





<!-- MUSIC PLAYER -->


<div class="player">


<h4 id="nowPlaying">

No song playing 🎵

</h4>


<audio id="audio"></audio>


<div style="display:flex;justify-content:center;gap:15px;">


<button class="play" onclick="previousSong()">

⏮

</button>


<button class="play" onclick="togglePlay()">

▶

</button>


<button class="play" onclick="nextSong()">

⏭

</button>


</div>


<input id="progress" type="range" value="0">


</div>




<nav>


<button onclick="showHome()">

🏠 Home

</button>



<button onclick="loadFavorites()">

❤️ Likes

</button>



<button onclick="showProfile()">

👤 Profile

</button>



<button onclick="showUpload()">

🎤 Upload

</button>


</nav>



</div>

<script type="module">


import { initializeApp }

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getAuth,

createUserWithEmailAndPassword,

signInWithEmailAndPassword,

GoogleAuthProvider,

signInWithPopup,

signOut,

onAuthStateChanged,

setPersistence,

browserSessionPersistence,

browserLocalPersistence

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getFirestore,

doc,

setDoc

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





// FIREBASE CONFIG


const firebaseConfig = {


apiKey: "AIzaSyBO7kaBZCIpWXXnVVHdHHe6kEO0GH4Rz_A",

authDomain: "loontunes-440de.firebaseapp.com",

projectId: "loontunes-440de",

storageBucket: "loontunes-440de.firebasestorage.app",

messagingSenderId: "69687205601",

appId: "1:69687205601:web:07041ce84f945efc4821a0",

measurementId: "G-LFNXLY2H34"


};





const app = initializeApp(firebaseConfig);


window.auth = getAuth(app);


window.db = getFirestore(app);




// EXPLICIT PERSISTENCE (default: local)
// we set local persistence explicitly, and provide helpers to switch to session-only if desired
setPersistence(window.auth, browserLocalPersistence)
  .then(() => {
    window.persistenceMode = 'local';
    updatePersistenceUI();
  })
  .catch(e => {
    console.warn('setPersistence default error', e);
    window.persistenceMode = 'local';
    updatePersistenceUI();
  });


// helper to switch to session-only persistence (call BEFORE signing in for it to apply to that sign-in)
window.useSessionPersistence = async function(){
  try{
    await setPersistence(window.auth, browserSessionPersistence);
    window.persistenceMode = 'session';
    updatePersistenceUI();
    alert('Session persistence enabled. Next sign-in will only persist for this tab.');
  }catch(e){
    alert('Could not set session persistence: ' + e.message);
  }
}

// helper to switch back to local persistence
window.useLocalPersistence = async function(){
  try{
    await setPersistence(window.auth, browserLocalPersistence);
    window.persistenceMode = 'local';
    updatePersistenceUI();
    alert('Local persistence enabled. Sign-ins will persist across browser restarts.');
  }catch(e){
    alert('Could not set local persistence: ' + e.message);
  }
}

// update buttons/indicator
function updatePersistenceUI(){
  const ind = document.getElementById('persistenceIndicator');
  const btnS = document.getElementById('btnSession');
  const btnL = document.getElementById('btnLocal');
  if(!ind || !btnS || !btnL) return;

  if(window.persistenceMode === 'session'){
    ind.innerText = 'Persistence: Session-only';
    btnS.classList.add('active');
    btnL.classList.remove('active');
  }else{
    ind.innerText = 'Persistence: Local (remember me)';
    btnL.classList.add('active');
    btnS.classList.remove('active');
  }
}


window.currentUser = null;


// AUTH STATE LISTENER (recommended)
onAuthStateChanged(window.auth, user => {
  if(user){
    window.currentUser = user;
    // open the app UI when a user is signed in
    try{ openApp(); }catch(e){ console.log('openApp missing', e); }
  } else {
    window.currentUser = null;
    try{ showLogin(); }catch(e){ console.log('showLogin missing', e); }
  }
});



// REGISTER


window.register = async function(){


let username =

document.getElementById("username").value;


let email =

document.getElementById("registerEmail").value;


let password =

document.getElementById("registerPassword").value;




try{


let result =

await createUserWithEmailAndPassword(

auth,

email,

password

);


currentUser=result.user;



await setDoc(

doc(db,"users",currentUser.uid),

{


username:username,

email:email,

createdAt:new Date()


}

);


alert("Account created 🎧");


showLogin();


}


catch(error){


alert(error.message);


}


}






// LOGIN


window.login = async function(){


let email =

document.getElementById("loginEmail").value;


let password =

document.getElementById("loginPassword").value;




try{


let result =

await signInWithEmailAndPassword(

auth,

email,

password

);


currentUser=result.user;


openApp();


}


catch(error){


alert(error.message);


}


}






// GOOGLE LOGIN



const provider =

new GoogleAuthProvider();



window.googleLogin = async function(){


try{


let result =

await signInWithPopup(

auth,

provider

);


currentUser = result.user;


openApp();


}catch(error){
  alert(error.message);
}

}



// LOGOUT (ensure signOut is used)
window.logout = async function(){
  try{
    await signOut(window.auth);
    window.currentUser = null;
    showLogin();
  }catch(e){
    alert('Logout failed: ' + e.message);
  }
}



// --- Rest of your existing app logic continues below ---

</script>

</body>
</html>
