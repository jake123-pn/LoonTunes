<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LoopTunes 🎧</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#080810;
color:white;
padding-bottom:90px;

}



.page{

height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;

}




.card{

background:#171722;
padding:30px;
border-radius:25px;
width:100%;
max-width:420px;

}



h1,h2{

text-align:center;
margin-bottom:20px;

}




input{

width:100%;
padding:15px;
margin:10px 0;

border:none;
outline:none;

border-radius:25px;

background:#252535;

color:white;

}




button{

cursor:pointer;

}



.main{

width:100%;
padding:15px;

border:none;

border-radius:25px;

background:linear-gradient(135deg,#6a11cb,#2575fc);

color:white;

margin-top:10px;

font-size:16px;

}



.google{

background:white;
color:black;

}



a{

color:#4da3ff;
cursor:pointer;

}





header{

background:linear-gradient(135deg,#6a11cb,#2575fc);

padding:25px;

border-radius:0 0 30px 30px;

}




.container{

padding:20px;

}




.song{

display:flex;

align-items:center;

gap:15px;

background:#171722;

padding:15px;

margin:15px 0;

border-radius:20px;

}



.song img{

width:70px;

height:70px;

border-radius:15px;

object-fit:cover;

}



.song-info{

flex:1;

}



.play,
.like{

width:45px;

height:45px;

border:none;

border-radius:50%;

background:#6a11cb;

color:white;

font-size:18px;

}



.like{

background:#e91e63;

}





.player{

position:fixed;

bottom:70px;

left:10px;

right:10px;

background:#171722;

padding:15px;

border-radius:20px;

}



#progress{

width:100%;

}





nav{

position:fixed;

bottom:0;

left:0;

right:0;

height:65px;

background:#11111a;

display:flex;

justify-content:space-around;

align-items:center;

}



nav button{

background:none;

border:none;

color:white;

}



.section{

display:none;

}




</style>


</head>



<body>





<!-- LOGIN -->


<div class="page" id="loginPage">


<div class="card">


<h1>
🎧 LoopTunes
</h1>


<h2>
Login
</h2>



<input
id="loginEmail"
type="email"
placeholder="Email">



<input
id="loginPassword"
type="password"
placeholder="Password">



<button class="main" onclick="login()">

Login

</button>




<button class="main google" onclick="googleLogin()">

🌐 Continue with Google

</button>




<p style="margin-top:15px">

No account?

<a onclick="showRegister()">

Create Account

</a>

</p>



</div>


</div>







<!-- REGISTER -->


<div class="page" id="registerPage" style="display:none;">



<div class="card">



<h2>
Create Account
</h2>



<input
id="username"
placeholder="Username">



<input
id="registerEmail"
type="email"
placeholder="Email">



<input
id="registerPassword"
type="password"
placeholder="Password">



<button class="main" onclick="register()">

Create Account

</button>




<p>

Already have account?

<a onclick="showLogin()">

Login

</a>

</p>



</div>


</div>





<!-- MAIN APP -->


<div id="app" style="display:none;">



<header>

<h1>
🎧 LoopTunes
</h1>


<p>
Your music world
</p>

</header>



<div class="container">



<!-- HOME -->


<div id="homeSection">



<input
id="searchBox"
class="search"
placeholder="Search songs..."
onkeyup="searchSongs()">



<h2>
Music Library
</h2>



<div id="songsList">

</div>



</div>





<!-- FAVORITES -->


<div id="favoritesSection" class="section">


<h2>
❤️ Favorites
</h2>


<div id="favoritesList">

</div>


</div>






<!-- PROFILE -->


<div id="profileSection" class="section">


<h2>
👤 Profile
</h2>


<p id="userName"></p>


<button class="main" onclick="logout()">

Logout

</button>


</div>




<!-- ADMIN UPLOAD PLACE -->


<div id="uploadSection" class="section">


<h2>
🎤 Upload Song
</h2>


<div id="uploadBox">


</div>


</div>



</div>





<!-- MUSIC PLAYER -->


<div class="player">


<h4 id="nowPlaying">

No song playing 🎵

</h4>



<audio id="audio"></audio>



<div style="display:flex;justify-content:center;gap:15px;">


<button class="play" onclick="previousSong()">

⏮

</button>


<button class="play" onclick="togglePlay()">

▶

</button>


<button class="play" onclick="nextSong()">

⏭

</button>


</div>



<input id="progress" type="range" value="0">


</div>





<nav>


<button onclick="showHome()">

🏠 Home

</button>



<button onclick="loadFavorites()">

❤️ Likes

</button>



<button onclick="showProfile()">

👤 Profile

</button>



<button onclick="showUpload()">

🎤 Upload

</button>



</nav>




</div>

<script type="module">


import { initializeApp }

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getAuth,

createUserWithEmailAndPassword,

signInWithEmailAndPassword,

GoogleAuthProvider,

signInWithPopup,

signOut

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



import {

getFirestore,

doc,

setDoc

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";







// FIREBASE CONFIG


const firebaseConfig = {


apiKey: "AIzaSyBO7kaBZCIpWXXnVVHdHHe6kEO0GH4Rz_A",

authDomain: "loontunes-440de.firebaseapp.com",

projectId: "loontunes-440de",

storageBucket: "loontunes-440de.firebasestorage.app",

messagingSenderId: "69687205601",

appId: "1:69687205601:web:07041ce84f945efc4821a0",

measurementId: "G-LFNXLY2H34"


};







const app = initializeApp(firebaseConfig);



window.auth = getAuth(app);



window.db = getFirestore(app);





window.currentUser = null;









// REGISTER


window.register = async function(){



let username =

document.getElementById("username").value;



let email =

document.getElementById("registerEmail").value;



let password =

document.getElementById("registerPassword").value;




try{


let result =

await createUserWithEmailAndPassword(

auth,

email,

password

);



currentUser=result.user;




await setDoc(

doc(db,"users",currentUser.uid),

{


username:username,

email:email,

createdAt:new Date()


}

);




alert("Account created 🎧");


showLogin();



}



catch(error){


alert(error.message);


}



}









// LOGIN


window.login = async function(){



let email =

document.getElementById("loginEmail").value;



let password =

document.getElementById("loginPassword").value;




try{


let result =

await signInWithEmailAndPassword(

auth,

email,

password

);



currentUser=result.user;



openApp();



}



catch(error){


alert(error.message);


}



}









// GOOGLE LOGIN



const provider =

new GoogleAuthProvider();





window.googleLogin = async function(){



try{


let result =

await signInWithPopup(

auth,

provider

);



currentUser=result.user;




await setDoc(

doc(db,"users",currentUser.uid),

{


username:currentUser.displayName,


email:currentUser.email


},


{

merge:true

}

);



openApp();



}



catch(error){


alert(error.message);


}



}









// LOGOUT



window.logout=function(){



signOut(auth);



currentUser=null;



document.getElementById("app").style.display="none";


document.getElementById("loginPage").style.display="flex";


}









// OPEN APP



window.openApp=function(){



document.getElementById("loginPage").style.display="none";


document.getElementById("registerPage").style.display="none";


document.getElementById("app").style.display="block";



loadSongs();



}









// SWITCH PAGES



window.showRegister=function(){



document.getElementById("loginPage").style.display="none";


document.getElementById("registerPage").style.display="flex";



}






window.showLogin=function(){



document.getElementById("registerPage").style.display="none";


document.getElementById("loginPage").style.display="flex";



}




window.showHome=function(){



document.getElementById("homeSection").style.display="block";


document.getElementById("favoritesSection").style.display="none";


document.getElementById("profileSection").style.display="none";


document.getElementById("uploadSection").style.display="none";


}






window.showProfile=function(){



document.getElementById("homeSection").style.display="none";


document.getElementById("favoritesSection").style.display="none";


document.getElementById("profileSection").style.display="block";


document.getElementById("uploadSection").style.display="none";



document.getElementById("userName").innerHTML =

"Logged in as: "+

(currentUser.email);



}






</script>

<script type="module">


import {

collection,

getDocs

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





let songs=[];

let currentSong=0;

let audio=document.getElementById("audio");








// LOAD SONGS


window.loadSongs = async function(){



let box=document.getElementById("songsList");



box.innerHTML="";



songs=[];



try{



let snapshot = await getDocs(

collection(window.db,"songs")

);




console.log("Songs found:",snapshot.size);





snapshot.forEach((doc)=>{



let song=doc.data();



songs.push(song);





box.innerHTML += `



<div class="song">


<img src="${song.coverURL || 'https://picsum.photos/200'}">



<div class="song-info">


<h3>

${song.title}

</h3>


<p>

${song.artist}

</p>


</div>




<button class="like"

onclick="likeSong(${songs.length-1})">

❤️

</button>




<button class="play"

onclick="playSong(${songs.length-1})">

▶

</button>




</div>



`;



});



}



catch(error){


console.log(error);


}



}









// PLAY SONG



window.playSong=function(index){



currentSong=index;



let song=songs[index];



if(!song){

return;

}




audio.src=song.audioURL;



audio.play();




document.getElementById("nowPlaying").innerHTML=

"🎵 "+song.title+" - "+song.artist;



}









// PLAY / PAUSE



window.togglePlay=function(){



if(audio.paused){


audio.play();


}

else{


audio.pause();


}



}









// NEXT



window.nextSong=function(){



currentSong++;



if(currentSong>=songs.length){


currentSong=0;


}



playSong(currentSong);



}









// PREVIOUS



window.previousSong=function(){



currentSong--;



if(currentSong<0){


currentSong=songs.length-1;


}



playSong(currentSong);



}









// SEARCH



window.searchSongs=function(){



let text=

document.getElementById("searchBox").value.toLowerCase();



let box=

document.getElementById("songsList");



box.innerHTML="";





songs.forEach((song,index)=>{



if(

song.title.toLowerCase().includes(text)

||

song.artist.toLowerCase().includes(text)

){



box.innerHTML += `



<div class="song">


<img src="${song.coverURL || 'https://picsum.photos/200'}">



<div class="song-info">


<h3>

${song.title}

</h3>


<p>

${song.artist}

</p>


</div>



<button class="like"

onclick="likeSong(${index})">

❤️

</button>




<button class="play"

onclick="playSong(${index})">

▶

</button>



</div>



`;



}



});



}









// PROGRESS BAR



audio.addEventListener(

"timeupdate",

()=>{


if(audio.duration){



document.getElementById("progress").value =

(audio.currentTime/audio.duration)*100;



}



}

);





document.getElementById("progress").oninput=function(){



if(audio.duration){



audio.currentTime =

(this.value/100)*audio.duration;



}



};






</script>

<script type="module">


import {

collection,

addDoc,

getDocs,

query,

where

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";








// LIKE SONG


window.likeSong = async function(index){



if(!currentUser){


alert("Login first");


return;


}




let song=songs[index];





await addDoc(

collection(window.db,"favorites"),

{


userId:currentUser.uid,


title:song.title,


artist:song.artist,


audioURL:song.audioURL,


coverURL:song.coverURL || ""


}

);



alert("Added to favorites ❤️");



}











// LOAD FAVORITES


window.loadFavorites = async function(){



showOnly("favoritesSection");



let box=

document.getElementById("favoritesList");



box.innerHTML="";



if(!currentUser){

alert("Login first");

return;

}




let q=query(

collection(window.db,"favorites"),

where(

"userId",

"==",

currentUser.uid

)

);






let result=await getDocs(q);





result.forEach((doc)=>{



let song=doc.data();





box.innerHTML += `


<div class="song">


<img src="${song.coverURL || 'https://picsum.photos/200'}">


<div class="song-info">


<h3>

${song.title}

</h3>


<p>

${song.artist}

</p>


</div>



<button class="play"

onclick="playFavorite('${song.audioURL}','${song.title}')">

▶

</button>



</div>



`;



});



}









// PLAY FAVORITE



window.playFavorite=function(url,title){



audio.src=url;


audio.play();



document.getElementById("nowPlaying").innerHTML=

"🎵 "+title;



}









// PROFILE PAGE



window.showProfile=function(){



showOnly("profileSection");



document.getElementById("userName").innerHTML=


"🎧 Account: "+currentUser.email;



}









// HIDE / SHOW SECTIONS



window.showOnly=function(section){



let sections=[

"homeSection",

"favoritesSection",

"profileSection",

"uploadSection"

];



sections.forEach((item)=>{



document.getElementById(item).style.display="none";



});





document.getElementById(section).style.display="block";



}







window.showHome=function(){



showOnly("homeSection");


}






</script>

<script type="module">


import {

collection,

addDoc

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";








// SHOW UPLOAD PAGE



window.showUpload=function(){



showOnly("uploadSection");



let box=document.getElementById("uploadBox");



box.innerHTML=`


<input

id="songTitle"

placeholder="Song title">


<input

id="songArtist"

placeholder="Artist name">


<input

id="songCover"

placeholder="Cover image URL">


<input

id="songAudio"

placeholder="MP3 audio URL">


<button class="main"

onclick="uploadSong()">

Add Song 🎵

</button>


`;



}









// UPLOAD SONG TO FIRESTORE



window.uploadSong = async function(){



let title=

document.getElementById("songTitle").value;



let artist=

document.getElementById("songArtist").value;



let coverURL=

document.getElementById("songCover").value;



let audioURL=

document.getElementById("songAudio").value;






if(!title || !artist || !audioURL){



alert("Fill all required fields");


return;


}







await addDoc(

collection(window.db,"songs"),

{


title:title,


artist:artist,


coverURL:coverURL,


audioURL:audioURL,


uploadedBy:currentUser.uid,


createdAt:new Date()



}

);






alert("Song added successfully 🎧");



loadSongs();



showHome();



}







</script>





</body>

</html>
